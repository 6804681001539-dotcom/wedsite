<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>จัดเวลานักศึกษา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#26344A;--blue:#3D5A80;--red:#C8553D;--green:#2E7D56;
  --gold:#C07D1A;--purple:#7B4FCA;--bg:#F5F1EA;--white:#fff;
  --gray:#6B6557;--lgray:#D9D2C5;--soft-blue:#E8EEF5;--soft-red:#FBEAE5;
  --soft-yellow:#FBF0D9;--soft-green:#EAF3EC;
  --nav-h:68px;
}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--navy);
     min-height:100vh;max-width:480px;margin:0 auto;position:relative;}
.kanit{font-family:'Kanit',sans-serif;}

/* ── Scrollbar ── */
::-webkit-scrollbar{display:none;}

/* ── Auth screens ── */
#auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--white);border-radius:20px;padding:32px 24px;width:100%;
           box-shadow:0 4px 24px rgba(0,0,0,.08);}
.auth-emoji{font-size:48px;text-align:center;margin-bottom:12px;}
.auth-title{font-size:22px;font-weight:700;text-align:center;color:var(--navy);margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--gray);text-align:center;margin-bottom:24px;}
.auth-tabs{display:flex;background:#F0EBE0;border-radius:10px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;padding:8px;text-align:center;border:none;background:transparent;
          border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;
          font-family:'Sarabun',sans-serif;color:var(--gray);transition:.2s;}
.auth-tab.active{background:var(--navy);color:#fff;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--navy);}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--lgray);border-radius:9px;
             font-size:14px;font-family:'Sarabun',sans-serif;color:var(--navy);background:#fff;
             transition:.2s;outline:none;}
.field input:focus{border-color:var(--blue);}
.btn-primary{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;
             border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
             font-family:'Sarabun',sans-serif;display:flex;align-items:center;
             justify-content:center;gap:7px;transition:.15s;margin-top:4px;}
.btn-primary:hover{background:#1E2A3A;}
.btn-primary:disabled{opacity:.6;cursor:default;}
.err-msg{color:var(--red);font-size:12.5px;margin-top:8px;text-align:center;}
.ok-msg{color:var(--green);font-size:12.5px;margin-top:8px;text-align:center;}

/* ── JWT badge ── */
.jwt-note{font-size:11px;color:var(--gray);text-align:center;margin-top:16px;
          padding:8px 12px;background:#F0EBE0;border-radius:8px;line-height:1.6;}
.jwt-note b{color:var(--navy);}

/* ── App shell ── */
#app{display:none;padding-bottom:var(--nav-h);}

/* ── Header ── */
.header{background:var(--navy);padding:14px 16px 12px;color:#fff;}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;}
.header-actions{display:flex;gap:6px;}
.header-btn{background:rgba(255,255,255,.15);border:none;border-radius:8px;
            padding:6px 10px;cursor:pointer;color:#fff;display:flex;align-items:center;
            gap:4px;font-size:12px;font-family:'Sarabun',sans-serif;}
.header-info{margin-top:7px;font-size:11px;color:rgba(255,255,255,.5);
             display:flex;align-items:center;gap:5px;}
.dot-green{width:5px;height:5px;border-radius:50%;background:#9FD4B8;display:inline-block;}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
            width:100%;max-width:480px;background:#fff;
            border-top:1px solid #E3DCCB;display:flex;padding:8px 8px 14px;
            gap:4px;z-index:50;}
.nav-btn{flex:1;padding:9px 4px;background:transparent;color:#8A8475;border:none;
         border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;
         display:flex;flex-direction:column;align-items:center;gap:2px;
         font-family:'Sarabun',sans-serif;transition:.15s;}
.nav-btn.active{background:var(--navy);color:#fff;}
.nav-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;
             stroke-linecap:round;stroke-linejoin:round;}

/* ── Content area ── */
.tab-content{display:none;padding:14px 14px 0;}
.tab-content.active{display:block;}

/* ── Cards ── */
.card{background:var(--white);border-radius:14px;padding:16px;margin-bottom:12px;
      box-shadow:0 1px 4px rgba(0,0,0,.07);}
.card-dark{background:var(--navy);color:#fff;}
.card-yellow{background:var(--soft-yellow);border:1px solid #E8C97A;}

/* ── Pills ── */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;}
.pill{padding:8px 14px;border-radius:20px;border:1.5px solid var(--lgray);
      background:#fff;color:var(--gray);font-weight:600;font-size:13px;
      cursor:pointer;white-space:nowrap;font-family:'Sarabun',sans-serif;
      flex-shrink:0;position:relative;transition:.15s;}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.pill-dot{position:absolute;top:2px;right:3px;width:5px;height:5px;
          border-radius:50%;background:var(--blue);}
.pill.active .pill-dot{background:rgba(255,255,255,.7);}

/* ── Timeline lane ── */
.timeline-wrap{overflow-x:auto;}
.timeline{position:relative;height:66px;}
.tl-labels{position:absolute;top:0;left:0;height:16px;width:100%;}
.tl-label{position:absolute;font-size:9.5px;color:#A39D8C;}
.tl-lane{position:absolute;top:20px;left:0;right:12px;bottom:4px;
         background:#F5F1EA;border-radius:8px;overflow:hidden;}
.tl-hour-line{position:absolute;top:0;bottom:0;}
.tl-block{position:absolute;top:3px;bottom:3px;border-radius:6px;color:#fff;
          font-size:9.5px;padding:2px 5px;overflow:hidden;
          display:flex;flex-direction:column;justify-content:center;}
.tl-block-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-rest{position:absolute;top:2px;bottom:2px;background:var(--soft-yellow);
         border:1px dashed #E8C97A;border-radius:5px;}

/* ── Item list ── */
.item-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
          border-radius:10px;margin-bottom:8px;}
.item-bar{width:4px;height:36px;border-radius:2px;flex-shrink:0;}
.item-name{font-weight:700;font-size:13px;}
.item-sub{font-size:11.5px;color:var(--gray);}
.btn-icon{border:none;background:none;cursor:pointer;color:#C0B8B0;padding:6px;}
.btn-edit{border:none;background:#E8EEF5;color:#3D5A80;cursor:pointer;padding:5px 9px;
          border-radius:7px;font-size:11.5px;font-weight:600;font-family:'Sarabun',sans-serif;}

/* ── Summary bars ── */
.sum-row{display:flex;justify-content:space-between;margin-bottom:9px;font-size:14px;}
.sum-bar{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:1px;margin-top:8px;}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal-head{font-size:10px;font-weight:700;color:#A39D8C;padding-bottom:4px;}
.cal-day{padding:5px 1px;border-radius:7px;cursor:pointer;font-size:13px;
         position:relative;user-select:none;transition:.1s;}
.cal-day:hover{background:#F0EBE0;}
.cal-day.today{background:var(--soft-blue);color:var(--blue);font-weight:700;}
.cal-day.selected{background:var(--navy);color:#fff;}
.cal-dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
         width:4px;height:4px;border-radius:50%;}
.mini-bar{height:5px;background:#EDE7D9;border-radius:4px;margin-bottom:12px;overflow:hidden;}
.mini-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .3s;}

/* ── Tag ── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
     border-radius:6px;font-size:11.5px;font-weight:600;}

/* ── Event rows ── */
.event-row{display:flex;align-items:center;gap:8px;padding:8px 10px;
           border-radius:9px;margin-bottom:6px;}

/* ── Bottom sheet modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
         display:none;align-items:flex-end;}
.overlay.open{display:flex;}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 36px;
       width:100%;max-width:480px;margin:0 auto;}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:16px;
             display:flex;justify-content:space-between;align-items:center;}
.type-btns{display:flex;gap:8px;margin-bottom:12px;}
.type-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
          padding:11px;border-radius:10px;border:2px solid var(--lgray);
          background:#fff;color:var(--gray);font-weight:700;cursor:pointer;
          font-size:13px;font-family:'Sarabun',sans-serif;transition:.15s;}
.type-btn.active-class{border-color:var(--blue);background:var(--soft-blue);color:var(--blue);}
.type-btn.active-work{border-color:var(--red);background:var(--soft-red);color:var(--red);}
.form-input{width:100%;padding:11px 12px;border-radius:9px;
            border:1.5px solid var(--lgray);font-size:14px;
            font-family:'Sarabun',sans-serif;color:var(--navy);
            background:#fff;margin-bottom:10px;outline:none;transition:.2s;}
.form-input:focus{border-color:var(--blue);}
.time-row{display:flex;gap:10px;margin-bottom:10px;}

/* ── Toast ── */
#toast-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);
            width:100%;max-width:480px;z-index:300;padding:8px 12px;
            display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{background:#fff;border-radius:10px;padding:10px 12px;
       box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;gap:8px;
       font-size:13px;pointer-events:all;border-left:4px solid;}

/* ── Password strength ── */
.pw-bar{height:4px;border-radius:4px;margin-top:5px;background:#EDE7D9;overflow:hidden;}
.pw-fill{height:100%;border-radius:4px;transition:width .3s,background .3s;}

/* ── Token debug ── */
.token-box{background:#F0EBE0;border-radius:8px;padding:10px;font-size:10.5px;
           color:var(--gray);word-break:break-all;line-height:1.6;margin-top:10px;
           font-family:'Courier New',monospace;}
</style>
</head>
<body>

<!-- ══════════════════ AUTH ══════════════════ -->
<div id="auth-wrap">
  <div class="auth-card">
    <div class="auth-emoji">📚</div>
    <div class="auth-title kanit">จัดเวลานักศึกษา</div>
    <div class="auth-sub">เข้าสู่ระบบเพื่อบันทึกตาราง<br>และ sync ข้ามอุปกรณ์</div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
      <button class="auth-tab" onclick="switchTab('register')">สมัครสมาชิก</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="field"><label>อีเมล</label>
        <input type="email" id="l-email" placeholder="student@email.com" autocomplete="email"/></div>
      <div class="field"><label>รหัสผ่าน</label>
        <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="btn-primary" onclick="doLogin()" id="btn-login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        เข้าสู่ระบบ
      </button>
      <div id="l-msg"></div>
      <p style="text-align:center;font-size:12px;color:var(--gray);margin-top:12px;cursor:pointer"
         onclick="fillDemo()">🔑 ใช้บัญชีทดสอบ</p>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="field"><label>ชื่อ</label>
        <input type="text" id="r-name" placeholder="ชื่อของคุณ"/></div>
      <div class="field"><label>อีเมล</label>
        <input type="email" id="r-email" placeholder="student@email.com"/></div>
      <div class="field">
        <label>รหัสผ่าน <span id="pw-strength-label" style="font-weight:400;color:var(--gray)"></span></label>
        <input type="password" id="r-password" placeholder="อย่างน้อย 8 ตัวอักษร" oninput="checkPw(this.value)"/>
        <div class="pw-bar"><div class="pw-fill" id="pw-fill" style="width:0%"></div></div>
      </div>
      <button class="btn-primary" onclick="doRegister()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        สมัครสมาชิก
      </button>
      <div id="r-msg"></div>
    </div>


  </div>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app">

  <!-- Toast -->
  <div id="toast-wrap"></div>

  <!-- Header -->
  <div class="header">
    <div class="header-row">
      <div class="header-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C879" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="kanit">จัดเวลานักศึกษา</span>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="toggleNotify()" id="notify-btn">
          <svg id="bell-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notify-label">เปิดเตือน</span>
        </button>
        <button class="header-btn" onclick="doLogout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          ออกจากระบบ
        </button>
      </div>
    </div>
    <div class="header-info">
      <span class="dot-green"></span>
      <span id="user-label">กำลังโหลด...</span>
    </div>
  </div>

  <!-- ── Schedule Tab ── -->
  <div id="tab-schedule" class="tab-content active">
    <div class="pills" id="day-pills"></div>

    <div class="card" style="padding:12px 0 8px">
      <div style="padding:0 14px 6px;display:flex;align-items:baseline;gap:8px">
        <span class="kanit" style="font-size:14px;font-weight:700" id="day-title">วันจันทร์</span>
        <span style="font-size:12px;color:var(--gray)" id="day-count"></span>
      </div>
      <div class="timeline-wrap" style="padding:0 4px">
        <div class="timeline" id="timeline" style="min-width:900px"></div>
      </div>
    </div>

    <div class="card" id="day-items-card" style="display:none">
      <p class="kanit" style="font-size:13px;font-weight:700;margin-bottom:10px" id="day-items-title"></p>
      <div id="day-items-list"></div>
    </div>

    <div class="card card-yellow" id="rest-card" style="display:none">
      <p class="kanit" style="font-size:13px;font-weight:700;margin-bottom:6px;color:#7A5C1E">🌙 เวลาพักแนะนำวันนี้</p>
      <div id="rest-list"></div>
    </div>

    <button class="btn-primary" onclick="openAddItem()" style="border-radius:12px;margin-bottom:4px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      เพิ่มกิจกรรม
    </button>
  </div>

  <!-- ── Yearly Tab ── -->
  <div id="tab-yearly" class="tab-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button onclick="yearView--; renderYearly()" style="background:#fff;border:1px solid var(--lgray);border-radius:9px;padding:8px 12px;cursor:pointer;display:flex">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="kanit" style="font-size:19px;font-weight:700" id="year-title"></span>
      <button onclick="yearView++; renderYearly()" style="background:#fff;border:1px solid var(--lgray);border-radius:9px;padding:8px 12px;cursor:pointer;display:flex">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="pills" id="month-pills"></div>
    <div class="card" id="month-card"></div>
    <div class="card" id="sel-date-card" style="display:none"></div>
    <div class="card" id="month-events-card" style="display:none"></div>
    <button class="btn-primary" onclick="openAddEvent()" style="border-radius:12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      เพิ่มกิจกรรมพิเศษ
    </button>
  </div>

  <!-- ── Summary Tab ── -->
  <div id="tab-summary" class="tab-content">
    <div class="card card-dark" id="summary-card"></div>
    <div id="daily-summary"></div>

    <!-- JWT Debug section -->
    <div class="card">
      <p class="kanit" style="font-size:14px;font-weight:700;margin-bottom:8px">🔑 JWT Token ที่ใช้งาน</p>
      <p style="font-size:12px;color:var(--gray);margin-bottom:6px">token นี้จะถูกส่งใน header ทุก API request</p>
      <div class="token-box" id="token-display"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
        <div style="background:#F0EBE0;border-radius:8px;padding:9px;font-size:12px">
          <div style="font-weight:700;color:var(--navy);margin-bottom:3px">Header</div>
          <div style="color:var(--gray);font-family:'Courier New',monospace;font-size:10px">Algorithm: HS256</div>
        </div>
        <div style="background:#F0EBE0;border-radius:8px;padding:9px;font-size:12px" id="jwt-payload-box">
          <div style="font-weight:700;color:var(--navy);margin-bottom:3px">Payload</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchMainTab('schedule',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      ตาราง
    </button>
    <button class="nav-btn" onclick="switchMainTab('yearly',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      รายปี
    </button>
    <button class="nav-btn" onclick="switchMainTab('summary',this)">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      สรุป
    </button>
  </nav>
</div>

<!-- ── Modal: Add Item ── -->
<div class="overlay" id="modal-item" onclick="closeIfOverlay(event,'modal-item')">
  <div class="sheet">
    <div class="sheet-title">
      <span class="kanit">เพิ่มกิจกรรม</span>
      <button class="btn-icon" onclick="closeModal('modal-item')">✕</button>
    </div>
    <div class="type-btns">
      <button class="type-btn active-class" id="type-class" onclick="setType('class')">📘 เรียน</button>
      <button class="type-btn" id="type-work" onclick="setType('work')">💼 งาน/พาร์ทไทม์</button>
    </div>
    <input class="form-input" id="item-name" placeholder="ชื่อวิชา / งาน"/>

//  JWT SIMULATION (ใน production ส่งไปที่ /auth/login จริงๆ)
// ══════════════════════════════════════════════════════════════
// สร้าง JWT จำลอง (ตัวอย่าง — production ใช้ backend จริง)
function b64url(obj){return btoa(JSON.stringify(obj)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');}
function makeJWT(payload){
  const header={alg:'HS256',typ:'JWT'};
  const p={...payload,iat:Math.floor(Date.now()/1000),exp:Math.floor(Date.now()/1000)+604800};
  // signature จำลอง (production ต้องทำบน backend ด้วย jsonwebtoken)
  const sig=btoa('HMAC-SHA256-SIMULATED-'+payload.email).replace(/=/g,'');
  return `${b64url(header)}.${b64url(p)}.${sig}`;
}
function parseJWT(token){
  try{const[,p]=token.split('.');return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));}
  catch{return null;}
}
function isTokenValid(token){
  const p=parseJWT(token);
  return p&&p.exp*1000>Date.now();
}

// ══════════════════════════════════════════════════════════════
//  CALC HELPERS
// ══════════════════════════════════════════════════════════════
function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function toLabel(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
function jsDayToOur(d){return d===0?6:d-1;}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function firstDayOfMonth(y,m){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}

function calcFreeByDay(){
  return Array.from({length:7},(_,d)=>{
    const busy=items.filter(i=>i.day===d).map(i=>[toMin(i.start),toMin(i.end)]).sort((a,b)=>a[0]-b[0]);
    const merged=[];
    for(const[s,e]of busy){if(merged.length&&s<=merged[merged.length-1][1])merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],e);else merged.push([s,e]);}
    let cur=DAY_START;const free=[];
    for(const[s,e]of merged){if(s>cur)free.push([cur,s]);cur=Math.max(cur,e);}
    if(cur<DAY_END)free.push([cur,DAY_END]);
    return free.filter(([s,e])=>e-s>=30);
  });
}
function calcRestByDay(freeByDay){
  const tgt=restTarget*60;
  return freeByDay.map((free,d)=>{
    const busy=items.filter(i=>i.day===d).map(i=>[toMin(i.start),toMin(i.end)]).sort((a,b)=>a[0]-b[0]);
    const sc=free.map(([s,e])=>({s,e,len:e-s,al:!!busy.find(b=>b[1]===s&&b[1]-b[0]>=120)})).sort((a,b)=>(b.al-a.al)||b.len-a.len);
    let rem=tgt;const rest=[],left=[];
    for(const b of sc){if(rem<=0){left.push([b.s,b.e]);continue;}const tk=Math.min(b.len,rem);rest.push([b.s,b.s+tk]);rem-=tk;if(tk<b.len)left.push([b.s+tk,b.e]);}
    return{rest,left,met:rem<=0};
  });
}

function save(){
  if(!currentUser)return;
  lsSet(`items_${currentUser.uid}`,items);
  lsSet(`events_${currentUser.uid}`,events);
  lsSet(`rest_${currentUser.uid}`,restTarget);
}

function buildDayPills(){
  const wrap=document.getElementById('day-pills');
  wrap.innerHTML=DAYS.map((d,i)=>`

      ${DAY_S[i]}${items.some(x=>x.day===i)?`<span class="pill-dot"></span>`:''}
    </button>`).join('');
}
function renderSchedule(){
  buildDayPills();
  const fbd=calcFreeByDay(), rbd=calcRestByDay(fbd);
  const dayItems=items.filter(i=>i.day===selDay).sort((a,b)=>toMin(a.start)-toMin(b.start));
  const rest=rbd[selDay];

  document.getElementById('day-title').textContent='วัน'+DAYS[selDay];
  document.getElementById('day-count').textContent=dayItems.length===0?'ไม่มีกิจกรรม':dayItems.length+' กิจกรรม';

  // Timeline
  const TL=document.getElementById('timeline');
  const totalMin=DAY_END-DAY_START, totalW=totalMin/60*HOUR_W;
  TL.style.minWidth=(totalW+24)+'px';
  let html=`<div class="tl-labels">`;
  for(let h=6;h<=22;h+=2) html+=`<div class="tl-label" style="left:${(h-6)*HOUR_W+(h===6?4:-14)}px">${String(h).padStart(2,'0')}:00</div>`;
  html+=`</div><div class="tl-lane">`;
  for(let h=7;h<=22;h++) html+=`<div class="tl-hour-line" style="left:${(h-6)*HOUR_W}px;border-left:1px ${h%2===0?'solid #E3DCCB':'dashed #EDE7D9'}"></div>`;
  rest.rest.forEach(([s,e])=>html+=`<div class="tl-rest" style="left:${(s-DAY_START)/60*HOUR_W}px;width:${(e-s)/60*HOUR_W}px"></div>`);
  dayItems.forEach(it=>{
    const m=TYPE_META[it.type],s=toMin(it.start),e=toMin(it.end),w=(e-s)/60*HOUR_W;
    html+=`<div class="tl-block" style="left:${(s-DAY_START)/60*HOUR_W}px;width:${Math.max(w,26)}px;background:${m.color}">
      <div class="tl-block-name">${it.name}</div>
      ${w>54?`<div style="opacity:.8;font-size:8.5px">${it.start}-${it.end}</div>`:''}
    </div>`;
  });
  html+=`</div>`;
  TL.innerHTML=html;

  // Item list
  const card=document.getElementById('day-items-card');
  if(dayItems.length>0){
    card.style.display='';
    document.getElementById('day-items-title').textContent='รายการวัน'+DAYS[selDay];
    document.getElementById('day-items-list').innerHTML=dayItems.map(it=>{
      const m=TYPE_META[it.type];
      return`<div class="item-row" style="background:${m.soft}">
        <div class="item-bar" style="background:${m.color}"></div>
        <div style="flex:1"><div class="item-name">${it.name}</div><div class="item-sub">${it.start} – ${it.end} · ${m.label}</div></div>
        <button class="btn-edit" onclick="openEditItem('${it.id}')">✏️ แก้ไข</button>
        <button class="btn-icon" onclick="removeItem('${it.id}')">🗑</button>
      </div>`;
    }).join('');
  }else card.style.display='none';

  // Rest
  const rc=document.getElementById('rest-card');
  if(rest.rest.length>0){
    rc.style.display='';
    document.getElementById('rest-list').innerHTML=rest.rest.map(([s,e])=>
      `<div style="font-size:13px;color:#7A5C1E;margin-bottom:2px">${toLabel(s)} – ${toLabel(e)} <span style="opacity:.7;font-size:11.5px">(${Math.round((e-s)/6)/10} ชม.)</span></div>`
    ).join('')+(rest.met?'':'<p style="font-size:11.5px;color:#C8553D;margin-top:8px">⚠ เวลาว่างไม่พอตามเป้า</p>');
  }else rc.style.display='none';

  renderSummary();
}

function removeItem(id){
  items=items.filter(i=>i.id!==id);save();renderSchedule();
  showToast('ลบกิจกรรมแล้ว','#C8553D');
}

// ══════════════════════════════════════════════════════════════
//  YEARLY TAB
// ══════════════════════════════════════════════════════════════
function calcMonthlyBusy(){
  const hrsByDay=items.reduce((a,i)=>{a[i.day]=(a[i.day]||0)+(toMin(i.end)-toMin(i.start));return a;},{});
  return Array.from({length:12},(_,m)=>{
    let t=0;for(let d=1;d<=daysInMonth(yearView,m);d++){const j=new Date(yearView,m,d).getDay();t+=(hrsByDay[jsDayToOur(j)]||0);}return t/60;
  });
}
function evByDate(){const r={};for(const e of events){if(!r[e.date])r[e.date]=[];r[e.date].push(e);}return r;}

function renderYearly(){
  document.getElementById('year-title').textContent=`ปี ${yearView+543}`;
  const mb=calcMonthlyBusy(), maxMB=Math.max(...mb,1);
  const evs=evByDate(), today=new Date();

  // month pills
  document.getElementById('month-pills').innerHTML=MONTHS.map((m,i)=>
    `<button class="pill${i===selMonth?' active':''}" onclick="selMonth=${i};selDate=null;renderYearly()">${m.slice(0,3)}.</button>`
  ).join('');

  // calendar card
  const numDays=daysInMonth(yearView,selMonth), firstDay=firstDayOfMonth(yearView,selMonth);
  let html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="kanit" style="font-size:15px;font-weight:700">${MONTHS[selMonth]} ${yearView+543}</span>
      <span style="font-size:12px;color:var(--gray)">${mb[selMonth].toFixed(0)} ชม.เรียน/งาน</span>
    </div>
    <div class="mini-bar"><div class="mini-fill" style="width:${mb[selMonth]/maxMB*100}%"></div></div>
    <div class="cal-grid">
      ${['จ','อ','พ','พฤ','ศ','ส','อา'].map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${Array.from({length:firstDay},()=>'<div></div>').join('')}
      ${Array.from({length:numDays},(_,i)=>{
        const day=i+1;
        const ds=`${yearView}-${String(selMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const ev=evs[ds]||[];
        const isTd=today.getFullYear()===yearView&&today.getMonth()===selMonth&&today.getDate()===day;
        const isSel=selDate===ds;
        return`<div class="cal-day${isSel?' selected':isTd?' today':''}" onclick="selDate=selDate==='${ds}'?null:'${ds}';renderYearly()">
          ${day}
          ${ev.length?`<div class="cal-dot" style="background:${isSel?'rgba(255,255,255,.8)':EV_META[ev[0].type].color}"></div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  document.getElementById('month-card').innerHTML=html;

  // selected date events
  const sdc=document.getElementById('sel-date-card');
  if(selDate){
    sdc.style.display='';
    const sEvs=evs[selDate]||[];
    sdc.innerHTML=`<p class="kanit" style="font-size:13px;font-weight:700;margin-bottom:8px">${selDate.split('-').reverse().map((v,i)=>i===2?Number(v):v).join('/')}</p>`+
      (sEvs.length===0?`<p style="font-size:13px;color:var(--gray)">ไม่มีกิจกรรมพิเศษ</p>`:
      sEvs.map(e=>{const et=EV_META[e.type];return`<div class="event-row" style="background:${et.bg}">
        <span style="width:8px;height:8px;border-radius:2px;background:${et.color};display:block;flex-shrink:0"></span>
        <span style="flex:1;font-size:13px">${e.name}</span>
        <button class="btn-icon" onclick="removeEvent('${e.id}')">🗑</button>
      </div>`;}).join(''));
  }else sdc.style.display='none';

  // month events list
  const mec=document.getElementById('month-events-card');
  const mEvs=events.filter(e=>e.date.startsWith(`${yearView}-${String(selMonth+1).padStart(2,'0')}`)).sort((a,b)=>a.date.localeCompare(b.date));
  if(mEvs.length>0){
    mec.style.display='';
    mec.innerHTML=`<p class="kanit" style="font-size:13px;font-weight:700;margin-bottom:8px">กิจกรรมเดือนนี้</p>`+
      mEvs.map(e=>{const et=EV_META[e.type],d=Number(e.date.split('-')[2]);
        return`<div class="event-row" style="background:${et.bg}">
          <span class="tag" style="background:${et.color}22;color:${et.color};min-width:28px;justify-content:center">${d}</span>
          <span style="font-size:11.5px;font-weight:700;color:${et.color};flex-shrink:0">${et.label}</span>
          <span style="flex:1;font-size:13px">${e.name}</span>
          <button class="btn-icon" onclick="removeEvent('${e.id}')">🗑</button>
        </div>`;}).join('');
  }else mec.style.display='none';
}

function removeEvent(id){
  events=events.filter(e=>e.id!==id);save();renderYearly();
  showToast('ลบกิจกรรมแล้ว','#C8553D');
}

// ══════════════════════════════════════════════════════════════
//  SUMMARY TAB
// ══════════════════════════════════════════════════════════════
function renderSummary(){
  const fbd=calcFreeByDay(), rbd=calcRestByDay(fbd);
  const totalBusy=items.reduce((s,i)=>s+(toMin(i.end)-toMin(i.start)),0);
  const totalFree=fbd.flat().reduce((s,[a,b])=>s+(b-a),0);
  const totalRest=rbd.reduce((s,d)=>s+d.rest.reduce((x,[a,b])=>x+(b-a),0),0);
  const daysOk=rbd.filter(d=>d.met).length;

  document.getElementById('summary-card').innerHTML=`
    <p class="kanit" style="font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:6px">
      ⭐ สรุปสัปดาห์นี้</p>
    ${[['เวลาเรียน+งาน',(totalBusy/60).toFixed(1)+' ชม.','#fff'],
       ['เวลาว่างรวม',(totalFree/60).toFixed(1)+' ชม.','#9FD4B8'],
       ['เวลาพักผ่อน',(totalRest/60).toFixed(1)+' ชม.','#F2C879']]
      .map(([l,v,c])=>`<div class="sum-row"><span style="color:#B7C0CF">${l}</span><strong style="color:${c}">${v}</strong></div>`).join('')}
    <div style="height:1px;background:rgba(255,255,255,.12);margin:10px 0"></div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="color:#B7C0CF;font-size:13px">เป้าพักผ่อน/วัน</span>
      <select onchange="restTarget=Number(this.value);save();renderSummary();renderSchedule()"
        style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:7px;padding:5px 8px;font-size:13px">
        ${[0.5,1,1.5,2,2.5,3].map(h=>`<option value="${h}"${restTarget===h?' selected':''}>${h} ชม.</option>`).join('')}
      </select>
    </div>
    <p style="font-size:12px;color:${daysOk===7?'#9FD4B8':'#F2A07A'};margin-top:9px">
      ${daysOk===7?'✓ ทุกวันมีเวลาพักครบ':`⚠ มี ${7-daysOk} วันที่เวลาพักไม่พอ`}</p>`;

  document.getElementById('daily-summary').innerHTML=DAYS.map((d,i)=>{
    const busy=items.filter(x=>x.day===i).reduce((s,x)=>s+(toMin(x.end)-toMin(x.start)),0);
    const free=fbd[i].reduce((s,[a,b])=>s+(b-a),0);
    const rest=rbd[i].rest.reduce((s,[a,b])=>s+(b-a),0);
    if(busy===0)return'';
    return`<div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span class="kanit" style="font-weight:700;font-size:14px">วัน${d}</span>
        <span style="font-size:12px;font-weight:600;color:${rbd[i].met?'#2E7D56':'#C8553D'}">${rbd[i].met?'✓ พักครบ':'⚠ พักไม่พอ'}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        ${busy>0?`<span class="tag" style="background:#E8EEF5;color:#3D5A80">${(busy/60).toFixed(1)} ชม.เรียน/งาน</span>`:''}
        ${rest>0?`<span class="tag" style="background:#FBF0D9;color:#9A7B2E">${(rest/60).toFixed(1)} ชม.พัก</span>`:''}
        ${free-rest>0?`<span class="tag" style="background:#EAF3EC;color:#2E7D56">${((free-rest)/60).toFixed(1)} ชม.ว่าง</span>`:''}
      </div>
      <div class="sum-bar">
        ${busy>0?`<div style="flex:${busy};background:#3D5A80"></div>`:''}
        ${rest>0?`<div style="flex:${rest};background:#E8C97A"></div>`:''}
        ${free-rest>0?`<div style="flex:${free-rest};background:#BFD9C8"></div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
//  TOKEN DEBUG
// ══════════════════════════════════════════════════════════════
function showToken(){
  const token=localStorage.getItem('jwt_token')||'';
  const parts=token.split('.');
  document.getElementById('token-display').textContent=
    parts.length===3?`${parts[0]}.\n${parts[1]}.\n${parts[2].slice(0,20)}...`:token;
  const payload=parseJWT(token);
  if(payload){
    const exp=new Date(payload.exp*1000);
    document.getElementById('jwt-payload-box').innerHTML=`
      <div style="font-weight:700;color:var(--navy);margin-bottom:3px">Payload</div>
      <div style="color:var(--gray);font-family:'Courier New',monospace;font-size:10px;line-height:1.6">
        id: ${payload.id}<br>
        email: ${payload.email}<br>
        name: ${payload.name}<br>
        exp: ${exp.toLocaleDateString('th-TH')}
      </div>`;
  }
}

// ══════════════════════════════════════════════════════════════
//  MODALS
// ══════════════════════════════════════════════════════════════
// ── Edit item ──────────────────────────────────────────────────────────────
let editingId=null;

function openEditItem(id){
  const it=items.find(i=>i.id===id);
  if(!it)return;
  editingId=id;
  setEditType(it.type);
  document.getElementById('edit-name').value=it.name;
  document.getElementById('edit-day').value=it.day;
  document.getElementById('edit-start').value=it.start;
  document.getElementById('edit-end').value=it.end;
  document.getElementById('edit-err').textContent='';
  document.getElementById('modal-edit').classList.add('open');
}

function setEditType(t){
  document.getElementById('edit-type-class').className='type-btn'+(t==='class'?' active-class':'');
  document.getElementById('edit-type-work').className='type-btn'+(t==='work'?' active-work':'');
  document.getElementById('edit-type-class').dataset.selected=t==='class'?'1':'';
  document.getElementById('edit-type-work').dataset.selected=t==='work'?'1':'';
}
function getEditType(){
  return document.getElementById('edit-type-class').dataset.selected?'class':'work';
}

function saveEdit(){
  const name=document.getElementById('edit-name').value.trim();
  const day=Number(document.getElementById('edit-day').value);
  const start=document.getElementById('edit-start').value;
  const end=document.getElementById('edit-end').value;
  if(!name)return document.getElementById('edit-err').textContent='กรอกชื่อก่อนนะ';
  if(start>=end)return document.getElementById('edit-err').textContent='เวลาเริ่มต้องน้อยกว่าเวลาเลิก';
  // จำลอง PATCH /items/:id
  items=items.map(i=>i.id===editingId?{...i,type:getEditType(),name,day,start,end}:i);
  save(); selDay=day;
  closeModal('modal-edit'); renderSchedule();
  showToast('แก้ไขกิจกรรมแล้ว ✓','#3D5A80');
}

function deleteFromEdit(){
  if(!confirm('ลบกิจกรรมนี้?'))return;
  items=items.filter(i=>i.id!==editingId);
  save(); closeModal('modal-edit'); renderSchedule();
  showToast('ลบกิจกรรมแล้ว','#C8553D');
}

function openAddItem(){
  document.getElementById('item-name').value='';
  document.getElementById('item-err').textContent='';
  setType('class');
  document.getElementById('modal-item').classList.add('open');
}
function openAddEvent(){
  document.getElementById('ev-date').value=selDate||'';
  document.getElementById('ev-name').value='';
  document.getElementById('ev-err').textContent='';
  document.getElementById('modal-event').classList.add('open');
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function closeIfOverlay(e,id){if(e.target===e.currentTarget)closeModal(id);}

function setType(t){
  currentType=t;
  document.getElementById('type-class').className='type-btn'+(t==='class'?' active-class':'');
  document.getElementById('type-work').className='type-btn'+(t==='work'?' active-work':'');
}

function saveItem(){
  const name=document.getElementById('item-name').value.trim();
  const day=Number(document.getElementById('item-day').value);
  const start=document.getElementById('item-start').value;
  const end=document.getElementById('item-end').value;
  if(!name)return document.getElementById('item-err').textContent='กรอกชื่อก่อนนะ';
  if(start>=end)return document.getElementById('item-err').textContent='เวลาเริ่มต้องน้อยกว่าเวลาเลิก';
  // จำลอง POST /items แล้วรับ id กลับ
  items.push({id:'i'+idSeed++,type:currentType,name,day,start,end});
  save(); closeModal('modal-item'); selDay=day;
  renderSchedule(); showToast('เพิ่มกิจกรรมแล้ว ✓','#2E7D56');
}

function saveEvent(){
  const date=document.getElementById('ev-date').value;
  const type=document.getElementById('ev-type').value;
  const name=document.getElementById('ev-name').value.trim();
  if(!date||!name)return document.getElementById('ev-err').textContent='กรอกวันที่และชื่อด้วยนะ';
  events.push({id:'e'+idSeed++,date,type,name});
  save(); closeModal('modal-event'); selDate=date;
  renderYearly(); showToast('เพิ่มกิจกรรมแล้ว ✓','#2E7D56');
}

// ══════════════════════════════════════════════════════════════
//  NOTIFICATIONS
// ══════════════════════════════════════════════════════════════
function toggleNotify(){
  notifyOn=!notifyOn;
  document.getElementById('notify-label').textContent=notifyOn?'เตือนเปิด':'เปิดเตือน';
  if(notifyOn){
    if(Notification?.permission==='default') Notification.requestPermission().catch(()=>{});
    notifyInterval=setInterval(checkNotify,30000); checkNotify();
  }else clearInterval(notifyInterval);
}
function checkNotify(){
  const now=new Date(),k0=now.toDateString(),ourDay=jsDayToOur(now.getDay());
  const nowMin=now.getHours()*60+now.getMinutes();
  items.forEach(i=>{
    const diff=toMin(i.start)-nowMin,k=`${k0}-${i.id}`;
    if(i.day===ourDay&&diff>0&&diff<=15&&!notified.has(k)){
      notified.add(k);
      const msg=`${TYPE_META[i.type].label}: ${i.name} เริ่ม ${i.start} น.`;
      showToast(msg,TYPE_META[i.type].color);
      if(Notification?.permission==='granted') try{new Notification('แจ้งเตือน',{body:msg});}catch{}
    }
  });
}

// ══════════════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════════════
function switchMainTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  btn.classList.add('active');
  if(name==='summary')showToken();
}
function showToast(msg,color){
  const wrap=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className='toast'; t.style.borderLeftColor=color;
  t.innerHTML=`<span style="flex:1">${msg}</span><button onclick="this.parentElement.remove()" style="border:none;background:none;cursor:pointer;color:#B0A99A">✕</button>`;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(),5000);
}
